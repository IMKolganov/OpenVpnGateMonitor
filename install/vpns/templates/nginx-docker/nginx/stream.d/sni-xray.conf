resolver 127.0.0.11 ipv6=off valid=10s;

upstream xray_vless {
    server datagate-monitor-xray:443;
}

# OpenVPN WSS (and other HTTPS) terminates inside this nginx on :8443 with proxy_protocol
upstream local_https {
    server 127.0.0.1:8443;
}

map $ssl_preread_server_name $datagate_https_backend {
    __XRAY_DOMAIN__     xray_vless;
    default             local_https;
}

# Real client IP → PROXY → xray or :8443 (both accept proxy_protocol)
server {
    listen 443;
    listen [::]:443;
    ssl_preread on;
    proxy_pass $datagate_https_backend;
    proxy_protocol on;
    proxy_connect_timeout 10s;
    proxy_timeout 1d;
}
