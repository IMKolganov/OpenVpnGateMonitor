# UDP OpenVPN WSS — reached via stream SNI → :8443 (proxy_protocol)
server {
    listen 8443 ssl proxy_protocol;
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header proxy_protocol;
    http2 on;
    server_name __UDP_WSS_DOMAIN__;

    ssl_certificate /etc/letsencrypt/live/__UDP_WSS_DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__UDP_WSS_DOMAIN__/privkey.pem;
    ssl_buffer_size 16k;

    location / {
        proxy_pass http://host.docker.internal:__UDP_API_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 10s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_socket_keepalive on;
        tcp_nodelay on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
